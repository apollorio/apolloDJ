<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>apollo-glass — strict JS test</title>
<script src="js/apollo-glass.js"></script>
<style>
  body {
    background: #f0f0f0;
    font-family: system-ui, sans-serif;
    display: flex;
    flex-wrap: wrap;
    gap: 32px;
    padding: 40px;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    margin: 0;
  }
  .row { display: flex; align-items: center; gap: 12px; flex-wrap: wrap; }
  label { font-size: 12px; color: #666; font-variant-numeric: tabular-nums; }
  .sz-16  { font-size: 16px; }
  .sz-24  { font-size: 24px; }
  .sz-48  { font-size: 48px; }
  .sz-128 { font-size: 128px; }
  .dark-bg { background: #111; border-radius: 12px; padding: 24px; }
</style>
</head>
<body>

  <p style="width:100%;text-align:center;margin:0;font-size:14px;color:#999">
    Strict mode: only <code>&lt;i class="apollo-glass"&gt;&lt;/i&gt;</code> + this script
  </p>

  <div class="row">
    <i class="apollo-glass sz-16"></i>
    <i class="apollo-glass sz-24"></i>
    <i class="apollo-glass sz-48"></i>
    <i class="apollo-glass sz-128"></i>
  </div>

  <p style="font-size:24px;background:#fff;padding:16px 20px;border-radius:8px">
    Inline <i class="apollo-glass"></i> in text
  </p>

  <div class="dark-bg row">
    <i class="apollo-glass sz-48"></i>
    <span style="color:#fff;font-size:13px">dark bg</span>
  </div>

  <button type="button" id="btn" style="padding:8px 16px;font-size:14px;cursor:pointer">
    apolloGlass.create()
  </button>
  <span id="dyn"></span>

  <script>
    document.getElementById('btn').addEventListener('click', function () {
      var el = apolloGlass.create({ fontSize: 64 });
      var host = document.getElementById('dyn');
      host.textContent = '';
      host.appendChild(el);
    });
  </script>
</body>
</html>
